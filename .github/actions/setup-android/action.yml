name: Set up Android build
description: >
  Installs the JDK and configures Gradle with remote caching. Shared by every
  workflow so the toolchain is defined in exactly one place.

inputs:
  google-services-json:
    description: >
      Contents of app/google-services.json. The file is deliberately not in the
      repository — it names a public project but this one is public too, so it
      is passed in from a secret and written here, where every workflow already
      shares a toolchain. The Firebase plugin refuses to configure without it.
      Empty is allowed: a run without access to the secret gets a placeholder
      instead, because Dependabot pull requests never receive repository
      secrets and every check would otherwise fail on a dependency bump.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Write google-services.json
      shell: bash
      env:
        GOOGLE_SERVICES_JSON: ${{ inputs.google-services-json }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          exit 0
        fi
        echo "::notice::No google-services.json secret available, using a placeholder. \
        Nothing that talks to Firebase is exercised in this run."
        cat > app/google-services.json <<'JSON'
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "trainr-placeholder",
            "storage_bucket": "trainr-placeholder.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.jericx.trainr" }
              },
              "oauth_client": [],
              "api_key": [ { "current_key": "AIzaSyPlaceholderPlaceholderPlaceholder000" } ],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            },
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000001",
                "android_client_info": { "package_name": "com.jericx.trainr.dev" }
              },
              "oauth_client": [],
              "api_key": [ { "current_key": "AIzaSyPlaceholderPlaceholderPlaceholder000" } ],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }
          ],
          "configuration_version": "1"
        }
        JSON

    - name: Set up JDK 17
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: temurin
        java-version: '17'

    # setup-gradle handles the build cache, the configuration cache and the
    # dependency cache, and writes a build summary into the run page. Caches are
    # written only from the default branch, so PR runs read a warm cache without
    # each branch competing to overwrite it.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
        add-job-summary: on-failure
