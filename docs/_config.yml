# The published pages share one layout so the policy a client opens from the
# app looks like the app, rather than like a raw markdown dump.
title: Trainr
description: A workout planner that builds your week on your phone.

# Only the three pages a client or a store reviewer is meant to land on get
# published. The handoff package is working material: it stays readable in
# the repository, where it is reviewed, rather than served as a styled page and
# indexed by search engines.
exclude:
  - unstuck-status.md
  - unstuck-handoff/

defaults:
  - scope:
      path: ""
    values:
      layout: default
